name: Bot checks and release
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/update.sh
      - name: Validate Compose with placeholder credentials
        env:
          TELEGRAM_API_ID: '12345'
          TELEGRAM_API_HASH: 0123456789abcdef0123456789abcdef
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Check container build
        run: docker build -t ani365-bot:test .

  publish:
    needs: test
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'bot-v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: '[[ "$RELEASE_TAG" =~ ^bot-v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/drumdrumspike/ani365-bot:${{ github.event.release.tag_name }}
