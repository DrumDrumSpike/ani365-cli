name: ani365
services:
  bot:
    image: ${BOT_IMAGE:-ani365-bot:local}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - bot-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  bot-data:
