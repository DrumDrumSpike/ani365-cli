name: ani365
services:
  media-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown 10001:10001 /jobs && chmod 755 /jobs && chown 101:101 /telegram-tmp && chmod 700 /telegram-tmp"]
    volumes:
      - media-jobs:/jobs
      - telegram-api-temp:/telegram-tmp
    restart: "no"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    depends_on:
      media-init:
        condition: service_completed_successfully
    volumes:
      - telegram-api-data:/var/lib/telegram-bot-api
      - telegram-api-temp:/tmp/telegram-bot-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  bot:
    image: ${BOT_IMAGE:-ani365-bot:local}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /jobs
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
    depends_on:
      media-init:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_started
    volumes:
      - bot-data:/data
      - media-jobs:/jobs
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 10m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  bot-data:
  telegram-api-data:
  telegram-api-temp:
  media-jobs:
