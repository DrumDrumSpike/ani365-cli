name: ani365
services:
  media-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown 10001:10001 /jobs && chmod 755 /jobs && chown 101:101 /telegram-tmp && chmod 700 /telegram-tmp"]
    volumes:
      - media-jobs:/jobs
      - telegram-api-temp:/telegram-tmp
    restart: "no"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set TELEGRAM_API_ID in .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set TELEGRAM_API_HASH in .env}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
    depends_on:
      media-init:
        condition: service_completed_successfully
    volumes:
      - telegram-api-data:/var/lib/telegram-bot-api
      - telegram-api-temp:/tmp/telegram-bot-api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  bot:
    image: ${BOT_IMAGE:-ani365-bot:local}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /jobs
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
    depends_on:
      media-init:
        condition: service_completed_successfully
      telegram-bot-api:
        condition: service_started
    volumes:
      - bot-data:/data
      - media-jobs:/jobs
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0
    pids_limit: 256
    stop_grace_period: 10m
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  web:
    image: ${BOT_IMAGE:-ani365-bot:local}
    build: .
    command: ["uvicorn", "ani365_bot.web:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /jobs
    depends_on:
      bot:
        condition: service_healthy
    volumes:
      - bot-data:/data
      - media-jobs:/jobs
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  recommender:
    image: ${BOT_IMAGE:-ani365-bot:local}
    build: .
    command: ["python", "-m", "ani365_recommender.main"]
    environment:
      MAIN_API_URL: http://web:8000
      RECOMMENDER_SHARED_SECRET: ${RECOMMENDER_SHARED_SECRET:-}
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  bot-data:
  telegram-api-data:
  telegram-api-temp:
  media-jobs:
  caddy-data:
  caddy-config:
